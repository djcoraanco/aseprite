name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - uses: aseprite/get-ninja@main

    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Generating Makefiles
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_TESTS=OFF \
          -DENABLE_SCRIPTING=on \
          -DENABLE_CCACHE=off \
          -DUSE_SHARED_CURL=OFF \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64)

    - name: Compiling
      shell: bash
      run: |
        cd build && ninja aseprite

    - name: Prepare Package
      shell: bash
      run: |
        mkdir -p release-pkg
        cp build/bin/aseprite.exe release-pkg/
        cp -r build/bin/data release-pkg/
        # Copiar cualquier DLL generada en la carpeta bin (OpenSSL, etc.)
        cp build/bin/*.dll release-pkg/ 2>/dev/null || true

    - name: Upload Aseprite Binary
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-x64
        path: release-pkg/
